[package]
name = "happydeck"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "happydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Already in the dependency tree transitively (wry/tao use these for their
# own macOS traffic-light-inset support) -- pinned here at the same
# major.minor so cargo resolves to the existing locked version instead of
# pulling a second copy. Used to position the traffic lights ourselves
# (src/macos_titlebar.rs) because wry's own set_traffic_light_inset only
# ever applies the configured y to the native title-bar container's
# *height*, never to the buttons' own vertical origin -- see that file for
# the full explanation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

