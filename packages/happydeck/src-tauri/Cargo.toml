[package]
name = "happydeck"
version = "0.5.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "happydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
tauri-plugin-notification = "2.3.3"
# Same version tauri-plugin-notification already resolves to, so this adds
# no crate to the build -- only direct access. The plugin discards the
# NotificationHandle that carries click activation; src/notification.rs
# needs it. See that file.
notify-rust = "4.18"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Already in the dependency tree transitively (wry/tao use these for their
# own macOS traffic-light-inset support) -- pinned here at the same
# major.minor so cargo resolves to the existing locked version instead of
# pulling a second copy. Used to position the traffic lights ourselves
# (src/macos_titlebar.rs) because wry's own set_traffic_light_inset only
# ever applies the configured y to the native title-bar container's
# *height*, never to the buttons' own vertical origin -- see that file for
# the full explanation.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Already resolved to 0.6.2 transitively (objc2-app-kit/objc2-foundation's
# own "block2" feature, which their locked build already has on -- see
# NSAnimationContext's runAnimationGroup: methods, gated on the same
# feature, which this crate already relied on before this change). Needed
# directly here for the block-based NSNotificationCenter observer in
# macos_titlebar.rs.
block2 = "0.6"

# Already resolved to 0.61.3 transitively in Cargo.lock, so pinning the
# same major.minor adds no new crate to the build -- only the extra
# features. Used by src/win_clipboard.rs to write the clipboard with this
# app's own HWND as owner; see that file for why the webview's own copy
# can't be used on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
# Already in the tree transitively via tauri-runtime-wry, and it is the
# exact crate Tauri's own PlatformWebview::controller() hands back, so the
# interface types must come from here rather than a second binding crate.
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

